---
# Approved Verbs for Naming Conventions
# Source of truth for verb-noun naming validation
# Used by: Shell scripts, Python scripts, and Ansible playbooks
# Inspired by PowerShell verb-noun discipline
# See: ../NAMING-STANDARD.md

approved_verbs:
  - apply
  - audit
  - bootstrap
  - build
  - cleanup
  - configure
  - create
  - deploy
  - destroy
  - disable
  - enable
  - harden
  - initialize
  - install
  - migrate
  - promote
  - publish
  - register
  - remove
  - rotate
  - sync
  - test
  - update
  - upgrade
  - validate
  - verify

# Verbs to avoid (for reference)
# These are too generic and don't convey clear intent, nor are all "verbs" in the traditional sense,
# but are commonly misused in script naming.
avoid_verbs:
  - do
  - fix
  - misc
  - run
  - stuff
  - temp
