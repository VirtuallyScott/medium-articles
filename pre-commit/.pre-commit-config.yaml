repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ansible-lint
        name: Ansible-lint
        description: Run ansible-lint on ansible/ directory
        entry: bash -c 'if [ -d "pre-commit/ansible" ]; then ansible-lint pre-commit/ansible/; fi'
        language: system
        always_run: true
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck
        description: Run shellcheck on all shell scripts
        entry: bash pre-commit/tools/validate-shell.sh
        language: system
        types: [shell]
        pass_filenames: false

      - id: shell-naming
        name: Shell Script Naming Convention
        description: Enforce verb-noun.sh naming with approved verbs
        entry: python3 pre-commit/tools/validate-shell-naming.py
        language: system
        types: [shell]
        pass_filenames: true

      - id: python-lint
        name: Python Linting
        description: Run Python linters (flake8, pylint, or ruff)
        entry: bash pre-commit/tools/validate-python.sh
        language: system
        types: [python]
        pass_filenames: false

      - id: python-naming
        name: Python Script Naming Convention
        description: Enforce verb-noun.py naming with approved verbs
        entry: python3 pre-commit/tools/validate-python-naming.py
        language: system
        types: [python]
        pass_filenames: true
